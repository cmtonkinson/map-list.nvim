name: test

on:
  pull_request:
  push:
    branches:
      - main
      - feat/*

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          sudo add-apt-repository ppa:neovim-ppa/unstable -y
          sudo apt-get update
          sudo apt-get install -y luarocks neovim
          sudo luarocks install luacheck

      - name: Run tests
        run: |
          make deps
          make lint
          make test-verbose
